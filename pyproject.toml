[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spyndex*"]

[project]
name = "spyndex"
version = "0.12.0"
authors = [
    {name = "David Montero Loaiza", email = "dml.mont@gmail.com"},
]
description = "Awesome Spectral Indices in Python"
readme = "README.md"

requires-python = ">=3.8"

classifiers=[
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "python-box>=6.0",
    "requests",
]

[project.urls]
"Bug Tracker"= "https://github.com/awesome-spectral-indices/spyndex/issues"
Documentation =  "https://spyndex.readthedocs.io"
"Source Code" = "https://github.com/awesome-spectral-indices/spyndex"

[tool.setuptools.package-data]
"spyndex.data" = ["*.json"]

# Compatibility between black and isort
[tool.isort]
profile = "black"

[project.optional-dependencies]
dask-array = [
    "dask[array]>=2023.7.0",
]
dask-dataframe = [
    "dask[dataframe]>=2023.7.0",
    "pandas>=2.0.3",
    "pyarrow",
]
ee = [
    "earthengine-api>=1.5.24",
    "eemont>=2025.7.1",
]
numpy = [
    "numpy",
]
pandas = [
    "pandas>=2.0.3",
]
plot = [
    "matplotlib",
    "numpy",
    "pandas>=2.0.3",
    "seaborn",
]
xarray = [
    "xarray>=2023.6.0",
]
